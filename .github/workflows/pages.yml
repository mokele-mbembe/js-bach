name: Deploy browser demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh-corpus:
        description: Recompute all transposition searches
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    with:
      upload-pages: true
      reuse-transposition-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.fresh-corpus }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
