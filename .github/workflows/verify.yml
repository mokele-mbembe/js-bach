name: Verify corpus

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
      - name: Locate the published Brotli report
        id: corpus
        run: echo "report=dist/corpus/builds/$(cat dist/corpus/current)/compression.md" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corpus-compression
          path: ${{ steps.corpus.outputs.report }}
          if-no-files-found: error
      - name: Pack and inspect the npm preview
        run: |
          npm run pack:preview:built
          npm pack --dry-run --ignore-scripts --json ./dist/npm/*.tgz > dist/npm/pack.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const reports = JSON.parse(readFileSync('dist/npm/pack.json', 'utf8'));
          assert.equal(reports.length, 1);
          const [archive] = reports;
          const project = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(archive.name, '@mokele-mbembe/js-bach');
          assert.equal(archive.version, project.version);
          const paths = new Set(archive.files.map(({ path }) => path));
          for (const path of ['LICENSE', 'README.md', 'SCORE-LICENSES.md', 'dist/scripts/serve-demo.js', 'dist/corpus/current']) {
            assert.ok(paths.has(path), `Missing ${path} from the npm tarball`);
          }
          console.log(`${archive.name}@${archive.version}, ${archive.size} bytes, ${archive.entryCount} files`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-preview
          path: dist/npm/
          if-no-files-found: error
