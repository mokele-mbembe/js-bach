name: Verify corpus

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the verified demo for deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
      - name: Locate the published Brotli report
        id: corpus
        run: echo "report=dist/corpus/builds/$(cat dist/corpus/current)/compression.md" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corpus-compression
          path: ${{ steps.corpus.outputs.report }}
          if-no-files-found: error
      - name: Pack the npm preview
        run: |
          npm run pack:preview:built
          npm pack --dry-run --ignore-scripts --json ./dist/npm/*.tgz > dist/npm/pack.json
      - name: Install Chromium for the playback check
        run: npm exec -- playwright install --with-deps --only-shell chromium
      - name: Verify playback and report download sizes
        run: npm run report:preview
      - name: Build and verify the static demo
        env:
          JS_BACH_PAGES_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          npm run build:pages:built
          npm run test:pages
      - name: Upload GitHub Pages artifact
        if: inputs.upload-pages && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-preview
          path: dist/npm/
          if-no-files-found: error
